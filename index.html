<style>
:root{--navy:#12304A;--teal:#168C8C;--sky:#5BB8D4;--gold:#F2B84B;--bg:#f4f8fa;--card:#fff;--text:#1d2b36;--muted:#5b6b78;--line:#d7e2e8;--err:#b54747}
@media (prefers-color-scheme:dark){:root{--bg:#0d1f2d;--card:#12304A;--text:#eef4f7;--muted:#a9bccb;--line:#2b4a63;--err:#ff8f8f}}
*{box-sizing:border-box}
body{margin:0;font-family:"Open Sans",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
.wrap{max-width:520px;margin:0 auto;padding:28px 18px 40px}
.logos{background:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.logos img{height:46px;width:auto;max-width:30%;object-fit:contain}
h1{font-family:Montserrat,sans-serif;font-size:1.7rem;line-height:1.2;margin:28px 0 8px;color:var(--teal)}
@media (prefers-color-scheme:dark){h1{color:var(--gold)}}
p.lead{margin:0 0 20px;color:var(--muted)}
form{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:14px;padding:22px}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 4px}
.field{margin-bottom:16px}
input[type=text],input[type=email]{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;background:transparent;color:var(--text)}
input:focus{outline:3px solid color-mix(in srgb,var(--sky) 55%,transparent);border-color:var(--sky)}
input[aria-invalid=true]{border-color:var(--err)}
.err{color:var(--err);font-size:.82rem;min-height:1.1em;margin-top:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.row{grid-template-columns:1fr}}
button{width:100%;font:700 1rem Montserrat,sans-serif;padding:13px;border:0;border-radius:9px;background:var(--navy);color:#fff;cursor:pointer}
button:hover{background:var(--teal)}button:disabled{opacity:.6;cursor:wait}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#status{margin-top:14px;padding:12px 14px;border-radius:9px;display:none;font-size:.95rem}
#status.ok{display:block;background:#e6f4f1;color:#0f5f5f}
#status.bad{display:block;background:#fbeeee;color:#8d2f2f}
.fine{font-size:.78rem;color:var(--muted);margin-top:14px}
</style>
</head>

  <h1>Subscribe to Medwell Health Information</h1>
  <p class="lead">Receive health information and updates from the Medwell Initiative. Just tell us who you are and where to send it.</p>
  <form id="f" novalidate>
    <div class="row">
      <div class="field"><label for="firstName">First name</label>
        <input type="text" id="firstName" name="firstName" autocomplete="given-name" maxlength="60" required>
        <div class="err" id="e-firstName"></div></div>
      <div class="field"><label for="lastName">Last name</label>
        <input type="text" id="lastName" name="lastName" autocomplete="family-name" maxlength="60" required>
        <div class="err" id="e-lastName"></div></div>
    </div>
    <div class="field"><label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>
      <div class="err" id="e-email"></div></div>
    <div class="hp" aria-hidden="true"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
    <button type="submit" id="btn">Subscribe</button>
    <div id="status" role="status" aria-live="polite"></div>
    <p class="fine">We use your details only to send you Medwell Health Information. To stop receiving it, contact the Medwell team.</p>
  </form>
</div>
<script>
// Paste the web-app URL from Deploy -> Manage deployments (it ends in /exec).
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJ2ejvqR9VViAl_127Polg1-TIjb34i-Bs02im8btWbW2uqAwjvGuMqleugjnzGTu6/exec";

const $ = id => document.getElementById(id);
const fields = ["firstName", "lastName", "email"];
const NAME_OK = /^[\p{L}][\p{L}\p{M}' .\-]*$/u, EMAIL_OK = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function setErr(f, msg) { $("e-" + f).textContent = msg || ""; $(f).setAttribute("aria-invalid", msg ? "true" : "false"); }
function showStatus(kind, msg) { const s = $("status"); s.className = kind; s.textContent = msg; }

function check() {
  const v = {}; let ok = true;
  fields.forEach(f => { v[f] = $(f).value.replace(/\s+/g, " ").trim(); setErr(f, ""); });
  if (!v.firstName) { setErr("firstName", "Please enter your first name."); ok = false; }
  else if (!NAME_OK.test(v.firstName)) { setErr("firstName", "Please use letters only."); ok = false; }
  if (!v.lastName) { setErr("lastName", "Please enter your last name."); ok = false; }
  else if (!NAME_OK.test(v.lastName)) { setErr("lastName", "Please use letters only."); ok = false; }
  if (!v.email) { setErr("email", "Please enter your email address."); ok = false; }
  else if (!EMAIL_OK.test(v.email)) { setErr("email", "Please enter a valid email address."); ok = false; }
  return ok ? v : null;
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const v = check();
  if (!v) return;
  if (APPS_SCRIPT_URL.indexOf("PASTE_") === 0) { showStatus("bad", "This form is not connected yet (web-app URL missing)."); return; }
  $("btn").disabled = true; showStatus("", "");
  try {
    // text/plain avoids a CORS preflight, which Apps Script web apps cannot answer.
    const res = await fetch(APPS_SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "subscribe", firstName: v.firstName, lastName: v.lastName, email: v.email, website: $("website").value }) });
    const data = await res.json();
    if (data.ok) { $("f").reset(); showStatus("ok", data.message); }
    else if (data.error && data.error.fields) { Object.keys(data.error.fields).forEach(k => setErr(k, data.error.fields[k])); showStatus("bad", data.error.message); }
    else showStatus("bad", (data.error && data.error.message) || "Something went wrong. Please try again.");
  } catch (err) {
    showStatus("bad", "Could not reach the server. Please check your connection and try again.");
  } finally { $("btn").disabled = false; }
});
</script>
